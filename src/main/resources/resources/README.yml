version: 1.0.0
# 使用指南：
# 如果你想关闭某个功能，在物品项中添加一行 enabled: false 即可，届时图标也不会显示。
# 如果你要在物品或GUI中使用papi变量，添加一行 use_papi: true 即可。
# 如果你想使用城邦内部变量，添加一行 use_gp: true。
# 在 gui.yml 中，被 {} 包括的是插件内部的占位符，被 %% 包括的是PAPI占位符

# 城邦变量表
# {city_state_name} 城邦名
# {city_state_ranking} 城邦排名
# {city_state_owner} 城邦会长
# {city_state_money} 城邦金币储备
# {city_state_points} 城邦点券储备
# {city_state_member_count} 城邦玩家数量
# {city_state_max_member_count} 城邦最大玩家数量
# {city_state_creation_time} 城邦创建时间
# {city_state_announcement_1} 城邦公告第一条

# 物品Flag表
# HIDE_ENCHANTS 隐藏附魔
# HIDE_ATTRIBUTES 隐藏属性
# HIDE_UNBREAKABLE 隐藏不可破坏
# HIDE_DESTROYS
# HIDE_PLACED_ON
# HIDE_POTION_EFFECTS
