name: Shop1
title: '&e&l城邦商店(1/2)'
row: 6
other_items:
  glass:
    indexes: '47-49,51-53'
    icon:
      material: WHITE_STAINED_GLASS_PANE
      display_name: ''
      lores:
        - '&cby July_ss'
simple_confirm_gui: &simple_confirm_gui
  row: 3
  title: '&c&l确认支付'
  items:
    confirm:
      index: 14
      icon:
        material: NETHER_STAR
        display_name: '&a确认'
        lores:
          - ' &e支付城邦币: {price}'
    cancel:
      index: 27
      icon:
        material: ARROW
        display_name: '&c返回'
items:
  '1':
    index: 11
    icon:
      material: GRASS_BLOCK
      display_name: '&f设置城邦主城'
      lores:
        - ' &f花费城邦币: {price}'
        - ' &f位置为你现在所在的位置'
    reward_type: CITY_STATE_SET_SPAWN
    sell:
      price: 1000
      success_message: '&f设置城邦主城成功, 花费城邦币: &ex{price}&f.'
      ConfirmGUI: *simple_confirm_gui
  '2':
    unavailable:
      index: 12
      reward_type: CITY_STATE_UPGRADE
      icon:
        material: EXPERIENCE_BOTTLE
        display_name: '&f城邦升级'
        lores:
          - ' &c无法继续升级'
    available:
      index: 12
      icon:
        material: EXPERIENCE_BOTTLE
        display_name: '&f城邦升级'
        lores:
          - ' &f花费城邦币: {price}'
          - ' &f城邦人数: {old} -> {new}'
    reward_type: CITY_STATE_UPGRADE
    sell:
      price: 1000
      success_message: '&f升级城邦人数成功, 最大人数: {old} -> {new}, 花费城邦币: x{price}.'
      ConfirmGUI: *simple_confirm_gui
  '3':
    index: 13
    icon:
      material: FEATHER
      display_name: '&f全员集结令'
      lores:
        - ' &f请求所有在线成员传送到你所在的位置'
    reward_type: CITY_STATE_TP_ALL
    sell:
      price: 1000
      success_message: '&f发出全员集结令成功, 花费城邦币: &ex{price}&f, 人数: x{count}.'
      ConfirmGUI: *simple_confirm_gui
  '4':
    index: 14
    icon:
      material: DIAMOND
      display_name: '&f购买10个钻石'
      lores:
        - ' &f这是个自定义物品'
        - ' &f花费城邦币: {price}'
        - ' &f购买10个钻石'
    reward_type: COMMANDS
    sell:
      commands:
        - 'give <player> DIAMOND 1'
      price: 1000
      success_message: '&f购买成功, 花费城邦币: &ex{price}&f.'
      ConfirmGUI: *simple_confirm_gui
  '49':
    index: 50
    icon:
      material: ARROW
      display_name: '&c返回'
    reward_type: BACK
  '54':
    index: 54
    icon:
      material: BOOK
      display_name: '&f下一页'
    reward_type: CITY_STATE_SHOP
    shop: Shop2
  '46':
    index: 46
    reward_type: NONE
    icon:
      material: BOOK
      display_name: '&f上一页'
      lores:
        - ' &f无'
